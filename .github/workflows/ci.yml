name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# `origin` is a local bare repo for now (see README). This workflow is dormant
# until the project gets a GitHub remote; it is kept in sync so it just works
# when that happens.
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run check-format
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
