name: Docker

# `origin` is a local bare repo for now (see README). This workflow is dormant
# until the project gets a GitHub remote; it is kept in sync so it just works
# when that happens.
on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
